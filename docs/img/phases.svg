<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .chev { stroke: #ffffff; stroke-width: 2; }
      .c0 { fill: #b9a98e; } .c1 { fill: #a37a4f; } .c2 { fill: #8a5a2b; } .c3 { fill: #6f4620; } .c4 { fill: #4e3217; }
      .ph { font-weight: 700; font-size: 13px; fill: #ffffff; }
      .days { font-size: 12px; fill: #fff5ea; }
      .gate { font-size: 11.5px; fill: #2a2a2a; }
      .gate-title { font-size: 11.5px; font-weight: 700; fill: #8a5a2b; }
      .tick { stroke: #8a5a2b; stroke-width: 1.4; }
      .deliv { font-size: 11.5px; fill: #4a4a4a; }
    </style>
  </defs>

  <!-- chevrons -->
  <polygon class="chev c0" points="20,70 196,70 214,100 196,130 20,130 38,100"/>
  <polygon class="chev c1" points="206,70 392,70 410,100 392,130 206,130 224,100"/>
  <polygon class="chev c2" points="402,70 598,70 616,100 598,130 402,130 420,100"/>
  <polygon class="chev c3" points="608,70 794,70 812,100 794,130 608,130 626,100"/>
  <polygon class="chev c4" points="804,70 962,70 980,100 962,130 804,130 822,100"/>

  <text x="120" y="94" text-anchor="middle" class="ph">0 · Droits et chemin court</text>
  <text x="120" y="114" text-anchor="middle" class="days">5 à 10 jours</text>
  <text x="312" y="94" text-anchor="middle" class="ph">1 · Preuve de faisabilité</text>
  <text x="312" y="114" text-anchor="middle" class="days">10 à 15 jours</text>
  <text x="512" y="94" text-anchor="middle" class="ph">2 · MVP vision + MCP</text>
  <text x="512" y="114" text-anchor="middle" class="days">15 à 25 jours</text>
  <text x="712" y="94" text-anchor="middle" class="ph">3 · Industrialisation</text>
  <text x="712" y="114" text-anchor="middle" class="days">10 à 15 jours</text>
  <text x="896" y="94" text-anchor="middle" class="ph">4 · Enrichissement</text>
  <text x="896" y="114" text-anchor="middle" class="days">5 à 10 jours</text>

  <!-- livrables (au-dessus) -->
  <text x="120" y="40" text-anchor="middle" class="deliv">accords, 50 vidéos sous droits,</text>
  <text x="120" y="55" text-anchor="middle" class="deliv">liens horodatés depuis PGN et chapitres</text>
  <text x="312" y="40" text-anchor="middle" class="deliv">20 vidéos, 2 000 images annotées,</text>
  <text x="312" y="55" text-anchor="middle" class="deliv">classifieur entraîné, mesure</text>
  <text x="512" y="40" text-anchor="middle" class="deliv">pipeline, serveur FastMCP, client MCP,</text>
  <text x="512" y="55" text-anchor="middle" class="deliv">200 vidéos, carte Vidéos horodatée</text>
  <text x="712" y="40" text-anchor="middle" class="deliv">file de tâches, GPU à la demande,</text>
  <text x="712" y="55" text-anchor="middle" class="deliv">supervision, validation, retrait</text>
  <text x="896" y="40" text-anchor="middle" class="deliv">transcription audio,</text>
  <text x="896" y="55" text-anchor="middle" class="deliv">positions proches</text>

  <!-- jalons go / no go (en dessous) -->
  <line x1="214" y1="130" x2="214" y2="160" class="tick"/>
  <text x="214" y="176" text-anchor="middle" class="gate-title">Go / no go</text>
  <text x="214" y="192" text-anchor="middle" class="gate">≥ 50 vidéos sous droits</text>
  <text x="214" y="207" text-anchor="middle" class="gate">sinon : pas de matière, arrêt</text>

  <line x1="410" y1="130" x2="410" y2="160" class="tick"/>
  <text x="410" y="176" text-anchor="middle" class="gate-title">Go / no go</text>
  <text x="410" y="192" text-anchor="middle" class="gate">≥ 90 % d'échiquiers exacts</text>
  <text x="410" y="207" text-anchor="middle" class="gate">&lt; 2 % de faux positifs (500 images)</text>
  <text x="410" y="222" text-anchor="middle" class="gate">sinon : bascule sur l'audio ou arrêt</text>

  <line x1="616" y1="130" x2="616" y2="160" class="tick"/>
  <text x="616" y="176" text-anchor="middle" class="gate-title">Go / no go</text>
  <text x="616" y="192" text-anchor="middle" class="gate">≥ 80 % des positions de théorie</text>
  <text x="616" y="207" text-anchor="middle" class="gate">ont un segment (200 vidéos)</text>
  <text x="616" y="222" text-anchor="middle" class="gate">retours de 2 clubs</text>

  <line x1="812" y1="130" x2="812" y2="160" class="tick"/>
  <text x="812" y="176" text-anchor="middle" class="gate-title">Critère</text>
  <text x="812" y="192" text-anchor="middle" class="gate">95 % des nouvelles vidéos</text>
  <text x="812" y="207" text-anchor="middle" class="gate">indexées sans intervention</text>
  <text x="812" y="222" text-anchor="middle" class="gate">opex mesuré ≤ 100 €/mois</text>

  <text x="500" y="268" text-anchor="middle" class="deliv">Total : 45 à 75 jours de travail · la recherche texte actuelle reste en repli à chaque phase</text>
</svg>
