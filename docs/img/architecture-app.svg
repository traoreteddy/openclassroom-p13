<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9387"/>
    </marker>
    <style>
      .zone { fill: none; stroke: #9a9387; stroke-width: 1.3; stroke-dasharray: 7 4; }
      .zone-docker { fill: #fbfaf7; stroke: #8a5a2b; stroke-width: 1.6; stroke-dasharray: none; }
      .zone-label { fill: #6b6b6b; font-size: 12.5px; font-weight: 700; letter-spacing: .05em; }
      .zone-label-docker { fill: #8a5a2b; }
      .box { stroke-width: 1.4; rx: 8; }
      .front { fill: #f6f1e7; stroke: #b9a98e; }
      .container { fill: #ffffff; stroke: #8a5a2b; }
      .inner { fill: #f6f1e7; stroke: #c9bda6; rx: 6; }
      .inner-strong { fill: #8a5a2b; stroke: #6f4620; rx: 6; }
      .store { fill: #ffffff; stroke: #6b6b6b; }
      .external { fill: #eeeae2; stroke: #8f887c; }
      .optional { fill: #f4f4f4; stroke: #a8a8a8; stroke-dasharray: 5 3; }
      .llm { fill: #4e3217; stroke: #3a2410; }
      .title { font-weight: 700; font-size: 14.5px; fill: #1f1f1f; }
      .title-light { font-weight: 700; font-size: 14.5px; fill: #ffffff; }
      .sub { font-size: 12px; fill: #6b6b6b; font-style: italic; }
      .text { font-size: 12.5px; fill: #2a2a2a; }
      .text-light { font-size: 12.5px; fill: #fff5ea; }
      .muted { font-size: 12px; fill: #777; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11.5px; }
      .flow { stroke: #4a4a4a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .flow-opt { stroke: #9a9387; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow-light); }
      .flow-label { font-size: 11.5px; fill: #4a4a4a; }
      .num { font-weight: 700; fill: #8a5a2b; }
      .port { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #8a5a2b; font-weight: 700; }
    </style>
  </defs>

  <!-- ============ Zone 1 : poste de l'utilisateur ============ -->
  <rect x="16" y="16" width="232" height="604" class="zone"/>
  <text x="30" y="36" class="zone-label">POSTE DE L'UTILISATEUR</text>

  <rect x="30" y="52" width="204" height="552" class="box front"/>
  <text x="132" y="78" text-anchor="middle" class="title">Navigateur</text>
  <text x="132" y="96" text-anchor="middle" class="sub">Angular 21 · signaux · standalone</text>

  <rect x="44" y="112" width="176" height="92" class="box inner"/>
  <text x="132" y="132" text-anchor="middle" class="title" font-size="13px">Échiquier</text>
  <text x="56" y="152" class="text">ngx-chess-board (dépôt local)</text>
  <text x="56" y="169" class="text">coups légaux, annuler, retourner</text>
  <text x="56" y="186" class="text">FEN : copier, charger, erreurs</text>

  <rect x="44" y="216" width="176" height="152" class="box inner"/>
  <text x="132" y="236" text-anchor="middle" class="title" font-size="13px">Panneau de conseils</text>
  <text x="56" y="256" class="text">· Position (trait, statut, coups)</text>
  <text x="56" y="273" class="text">· Coups des maîtres (Lichess)</text>
  <text x="56" y="290" class="text">· Conseil de l'agent + analyse</text>
  <text x="56" y="307" class="text">  profonde (sondage 2 s)</text>
  <text x="56" y="324" class="text">· Vidéos pour réviser (lecteur)</text>
  <text x="56" y="341" class="text">· Poser une question (session)</text>
  <text x="56" y="358" class="muted">RichTextPipe : gras, listes, liens</text>

  <rect x="44" y="380" width="176" height="92" class="box inner"/>
  <text x="132" y="400" text-anchor="middle" class="title" font-size="13px">Services</text>
  <text x="56" y="420" class="text">GameStateService (partie, FEN)</text>
  <text x="56" y="437" class="text">AdviceService (cache par FEN,</text>
  <text x="56" y="454" class="text">anti-rebond 400 ms, annulation)</text>

  <rect x="44" y="484" width="176" height="56" class="box inner"/>
  <text x="132" y="504" text-anchor="middle" class="title" font-size="13px">ApiService</text>
  <text x="132" y="523" text-anchor="middle" class="mono">HttpClient → /api/v1/…</text>

  <text x="132" y="568" text-anchor="middle" class="muted">Tests : Vitest (33)</text>
  <text x="132" y="586" text-anchor="middle" class="muted">Production : fichiers statiques nginx</text>

  <!-- Navigateur → nginx -->
  <line x1="234" y1="130" x2="298" y2="130" class="flow"/>
  <text x="266" y="120" text-anchor="middle" class="flow-label">HTTP</text>
  <text x="266" y="146" text-anchor="middle" class="port">:8080</text>

  <!-- ============ Zone 2 : Docker Compose ============ -->
  <rect x="280" y="16" width="630" height="768" class="zone zone-docker"/>
  <text x="294" y="36" class="zone-label zone-label-docker">DOCKER COMPOSE · réseau interne, tout en local</text>

  <!-- Conteneur frontend (nginx) -->
  <rect x="300" y="52" width="190" height="158" class="box container"/>
  <text x="395" y="74" text-anchor="middle" class="title">frontend · nginx</text>
  <text x="395" y="91" text-anchor="middle" class="sub">image en 2 étapes (build Angular)</text>
  <text x="312" y="114" class="text">· sert l'application compilée</text>
  <text x="312" y="131" class="text">· relaie <tspan class="mono">/api/</tspan> vers</text>
  <text x="312" y="148" class="mono">  backend:8000 (délai 300 s)</text>
  <text x="312" y="165" class="text">· une seule origine : pas de</text>
  <text x="312" y="182" class="text">  CORS en production</text>
  <text x="395" y="201" text-anchor="middle" class="port">80 → hôte :8080</text>

  <!-- Encadré : parcours d'une demande -->
  <rect x="510" y="52" width="380" height="158" class="box inner"/>
  <text x="700" y="74" text-anchor="middle" class="title">Quand l'utilisateur joue un coup</text>
  <text x="524" y="96" class="text" font-size="12px"><tspan class="num">1</tspan>  FEN envoyée → <tspan font-weight="700">coups des maîtres</tspan> (Lichess, cache)</text>
  <text x="524" y="114" class="text" font-size="12px"><tspan class="num">2</tspan>  ouverture nommée → <tspan font-weight="700">vidéos</tspan> filtrées (YouTube, cache 7 j)</text>
  <text x="524" y="132" class="text" font-size="12px"><tspan class="num">3</tspan>  à la demande → <tspan font-weight="700">conseil de l'agent</tspan> : Lichess, Stockfish,</text>
  <text x="524" y="148" class="text" font-size="12px">     encyclopédie, vidéos, puis rédaction locale (30 à 90 s)</text>
  <text x="524" y="166" class="text" font-size="12px"><tspan class="num">4</tspan>  en option → <tspan font-weight="700">analyse profonde</tspan> Stockfish en tâche de fond</text>
  <text x="524" y="184" class="text" font-size="12px"><tspan class="num">5</tspan>  <tspan font-weight="700">question libre</tspan> → le modèle choisit ses outils (3 appels max)</text>
  <text x="524" y="202" class="muted" font-size="11px">1 et 2 : automatiques · 3, 4, 5 : à la demande de l'utilisateur</text>

  <!-- nginx → backend -->
  <line x1="395" y1="210" x2="395" y2="236" class="flow"/>
  <text x="404" y="228" class="flow-label mono">/api/v1</text>

  <!-- Conteneur backend -->
  <rect x="300" y="238" width="590" height="410" class="box container"/>
  <text x="595" y="260" text-anchor="middle" class="title">backend · FastAPI (Python 3.13, uv, pydantic)</text>
  <text x="595" y="277" text-anchor="middle" class="sub">433 tests, couverture 97 % · bilan de santé /healthcheck</text>

  <!-- Routes -->
  <rect x="314" y="288" width="562" height="68" class="box inner"/>
  <text x="326" y="306" class="title" font-size="12.5px">Routes <tspan class="mono" font-weight="400">/api/v1</tspan></text>
  <text x="326" y="322" class="mono" font-size="11px">GET   moves/{fen} · evaluate/{fen} · vector-search · videos/{opening} · tools</text>
  <text x="326" y="337" class="mono" font-size="11px">GET   analysis/{id} · healthcheck          POST  analysis/{fen} → 202 (ticket)</text>
  <text x="326" y="352" class="mono" font-size="11px">POST  agent/analyze (position + question) · agent/ask (question libre)</text>

  <!-- Agent -->
  <rect x="314" y="366" width="268" height="122" class="box inner-strong"/>
  <text x="448" y="386" text-anchor="middle" class="title-light">Agent LangGraph</text>
  <text x="326" y="405" class="text-light">Parcours « position » : déterministe</text>
  <text x="326" y="420" class="text-light">  Lichess d'abord, Stockfish si hors théorie</text>
  <text x="326" y="437" class="text-light">Parcours « question » : le modèle décide</text>
  <text x="326" y="452" class="text-light">  (appel d'outils natif, budget 3 appels)</text>
  <text x="326" y="469" class="text-light">Recherche multi-sauts dans l'encyclopédie</text>
  <text x="326" y="483" class="text-light">Réponse rédigée en français, sources citées</text>

  <!-- Registre d'outils -->
  <rect x="594" y="366" width="282" height="122" class="box inner"/>
  <text x="735" y="386" text-anchor="middle" class="title">Registre de 7 outils (ToolSpec)</text>
  <text x="606" y="405" class="mono">inspect_position         python-chess</text>
  <text x="606" y="420" class="mono">get_opening_theory       Lichess</text>
  <text x="606" y="435" class="mono">evaluate_position        Stockfish</text>
  <text x="606" y="450" class="mono">search_opening_knowledge Milvus</text>
  <text x="606" y="465" class="mono">find_opening_videos      YouTube</text>
  <text x="606" y="480" class="mono">start_/get_deep_analysis Stockfish</text>

  <!-- Agent ↔ registre -->
  <line x1="582" y1="427" x2="592" y2="427" class="flow"/>

  <!-- Moteurs locaux -->
  <rect x="314" y="502" width="160" height="58" class="box store"/>
  <text x="394" y="522" text-anchor="middle" class="title" font-size="13px">Stockfish 17.1</text>
  <text x="394" y="538" text-anchor="middle" class="text">binaire dans le conteneur</text>
  <text x="394" y="553" text-anchor="middle" class="muted">10 s / 2 tentatives · 3 lignes</text>

  <rect x="486" y="502" width="214" height="58" class="box store"/>
  <text x="593" y="522" text-anchor="middle" class="title" font-size="13px">Encodeur de texte</text>
  <text x="593" y="538" text-anchor="middle" class="text">Qwen3-Embedding-0.6B · 1024 dims</text>
  <text x="593" y="553" text-anchor="middle" class="muted">CPU float32 · poids dans hf_models</text>

  <rect x="712" y="502" width="164" height="58" class="box store"/>
  <text x="794" y="522" text-anchor="middle" class="title" font-size="13px">Analyses profondes</text>
  <text x="794" y="538" text-anchor="middle" class="text">tâches de fond en mémoire</text>
  <text x="794" y="553" text-anchor="middle" class="muted">ticket, état, résultat</text>

  <!-- flèches registre → moteurs -->
  <line x1="394" y1="488" x2="394" y2="500" class="flow"/>
  <line x1="593" y1="488" x2="593" y2="500" class="flow"/>
  <line x1="794" y1="488" x2="794" y2="500" class="flow"/>

  <!-- Journal -->
  <rect x="314" y="572" width="562" height="64" class="box store"/>
  <text x="326" y="591" class="title" font-size="13px">Journal de décision (OpenTelemetry)</text>
  <text x="326" y="608" class="text">chaque décision, appel d'outil et réponse : durée, tokens, statut, issue → fichier JSON Lines</text>
  <text x="326" y="624" class="text">même instrumentation exportée vers Langfuse si des clés sont réglées</text>

  <!-- Données -->
  <rect x="300" y="668" width="250" height="100" class="box store"/>
  <text x="425" y="690" text-anchor="middle" class="title">mongodb · MongoDB 8</text>
  <text x="312" y="710" class="text">· corpus brut (12 articles Wikipédia FR)</text>
  <text x="312" y="727" class="text">· cache vidéos (TTL) · quota YouTube / jour</text>
  <text x="312" y="744" class="text">· volume mongodb_data</text>
  <text x="425" y="762" text-anchor="middle" class="port">:27017</text>

  <rect x="566" y="668" width="200" height="100" class="box store"/>
  <text x="666" y="690" text-anchor="middle" class="title">milvus · Milvus 2.6</text>
  <text x="578" y="710" class="text">· 367 unités vectorisées</text>
  <text x="578" y="727" class="text">· score ≥ 0,60 · rappel@5 : 0,87</text>
  <text x="578" y="744" class="text">· etcd + MinIO, 3 volumes</text>
  <text x="666" y="762" text-anchor="middle" class="port">:19530</text>

  <rect x="782" y="668" width="108" height="100" class="box optional"/>
  <text x="836" y="690" text-anchor="middle" class="title" font-size="13px">Langfuse</text>
  <text x="836" y="708" text-anchor="middle" class="muted">profil tracing</text>
  <text x="836" y="724" text-anchor="middle" class="muted">optionnel,</text>
  <text x="836" y="740" text-anchor="middle" class="muted">arrêté par défaut</text>
  <text x="836" y="758" text-anchor="middle" class="muted">(6 services)</text>

  <!-- flèches backend → données -->
  <line x1="425" y1="648" x2="425" y2="666" class="flow"/>
  <text x="434" y="662" class="flow-label">cache, quota, corpus</text>
  <line x1="666" y1="648" x2="666" y2="666" class="flow"/>
  <text x="675" y="662" class="flow-label">recherche vectorielle</text>
  <line x1="836" y1="648" x2="836" y2="666" class="flow-opt"/>

  <!-- ============ Zone 3 : machine hôte ============ -->
  <rect x="930" y="16" width="234" height="196" class="zone"/>
  <text x="944" y="36" class="zone-label">MACHINE HÔTE · hors Docker</text>

  <rect x="944" y="52" width="206" height="146" class="box llm"/>
  <text x="1047" y="76" text-anchor="middle" class="title-light">Ollama</text>
  <text x="1047" y="94" text-anchor="middle" class="text-light">modèle de langage local</text>
  <text x="1047" y="118" text-anchor="middle" class="text-light" font-weight="700">qwen3:14b</text>
  <text x="1047" y="136" text-anchor="middle" class="text-light">GPU de la machine (Metal)</text>
  <text x="1047" y="158" text-anchor="middle" class="text-light">décide, rédige, juge les sauts</text>
  <text x="1047" y="182" text-anchor="middle" class="port" fill="#fff5ea">host.docker.internal:11434</text>
  <text x="1047" y="208" text-anchor="middle" class="flow-label">← appelé par l'agent (chat, appels d'outils)</text>

  <!-- Agent → Ollama : sort du conteneur backend par son bord droit -->
  <path d="M 890 300 C 920 300, 918 150, 942 150" class="flow"/>

  <!-- ============ Zone 4 : services en ligne ============ -->
  <rect x="930" y="232" width="234" height="268" class="zone"/>
  <text x="944" y="252" class="zone-label">INTERNET · services tiers</text>

  <rect x="944" y="268" width="206" height="106" class="box external"/>
  <text x="1047" y="290" text-anchor="middle" class="title">Lichess Opening Explorer</text>
  <text x="956" y="310" class="text">coups des maîtres par position,</text>
  <text x="956" y="327" class="text">nom ECO, effectifs, résultats</text>
  <text x="956" y="344" class="muted">jeton personnel · 5 s / 3 tentatives</text>
  <text x="956" y="361" class="muted">repli : « hors théorie »</text>

  <rect x="944" y="386" width="206" height="104" class="box external"/>
  <text x="1047" y="408" text-anchor="middle" class="title">YouTube Data API v3</text>
  <text x="956" y="428" class="text">recherche FR + EN, détails vidéos,</text>
  <text x="956" y="445" class="text">filtre qualité (durée, vues, titre)</text>
  <text x="956" y="462" class="muted">clé API · 10 000 unités / jour</text>
  <text x="956" y="479" class="muted">201 unités / ouverture · réserve 500</text>

  <!-- Outils → services -->
  <path d="M 890 420 L 942 321" class="flow"/>
  <path d="M 890 465 L 942 438" class="flow"/>
  <text x="916" y="418" class="flow-label" text-anchor="middle">HTTPS</text>

  <!-- ============ Légende ============ -->
  <rect x="930" y="520" width="234" height="264" class="zone"/>
  <text x="944" y="540" class="zone-label">LÉGENDE</text>
  <rect x="946" y="554" width="16" height="16" class="box container"/><text x="970" y="567" class="text">conteneur Docker du projet</text>
  <rect x="946" y="579" width="16" height="16" class="box inner"/><text x="970" y="592" class="text">composant interne</text>
  <rect x="946" y="604" width="16" height="16" class="box inner-strong"/><text x="970" y="617" class="text">agent (cœur de la solution)</text>
  <rect x="946" y="629" width="16" height="16" class="box store"/><text x="970" y="642" class="text">moteur ou donnée locale</text>
  <rect x="946" y="654" width="16" height="16" class="box llm"/><text x="970" y="667" class="text">modèle de langage (hôte)</text>
  <rect x="946" y="679" width="16" height="16" class="box external"/><text x="970" y="692" class="text">service tiers (jeton ou clé)</text>
  <rect x="946" y="704" width="16" height="16" class="box optional"/><text x="970" y="717" class="text">optionnel, arrêté par défaut</text>
  <line x1="946" y1="742" x2="990" y2="742" class="flow"/><text x="998" y="746" class="text">flux de données</text>
  <line x1="946" y1="766" x2="990" y2="766" class="flow-opt"/><text x="998" y="770" class="text">flux optionnel</text>

  <!-- Pied -->
  <text x="132" y="648" text-anchor="middle" class="muted">Secrets : fichier .env local</text>
  <text x="132" y="666" text-anchor="middle" class="muted">(jeton Lichess, clé YouTube),</text>
  <text x="132" y="684" text-anchor="middle" class="muted">jamais dans le dépôt</text>
  <text x="132" y="716" text-anchor="middle" class="muted">Démarrage : docker compose up -d</text>
  <text x="132" y="734" text-anchor="middle" class="muted">puis scripts/smoke.sh (10 vérifs)</text>
</svg>
