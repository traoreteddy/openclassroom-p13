# Front Angular servi par nginx ; l'API est relayée vers le conteneur backend, donc le
# navigateur ne voit qu'une origine (pas de CORS en production).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le conseil complet de l'agent (modèle local) peut prendre plus d'une minute
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Application à page unique : toute route inconnue renvoie index.html
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
