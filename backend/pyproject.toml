[project]
name = "backend"
version = "0.1.0"
description = "API de l’agent IA d’apprentissage des ouvertures (FFE)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.0",
    "langchain-ollama>=1.1",
    "langchain-text-splitters>=1.0",
    "langfuse>=5.0",
    "langgraph>=1.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    "pymilvus>=2.6.17,<2.7",
    "pymongo>=4.18.2",
    "sentence-transformers>=5.1",
    "tenacity>=9.2.1",
    "torch>=2.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13",
    "httpx2>=2.13.1",
    "langchain-experimental>=0.4.2",
    "lxml>=6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests qui exigent un service réel (Stockfish, réseau…) ; exclus par défaut",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

# PyTorch en version CPU dans le conteneur Linux (l'index par défaut embarque CUDA, ~2 Go
# inutiles ici). Sur macOS, la version standard de PyPI est déjà sans CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
